version: '3.9'

services:
  seq:
    image: datalust/seq:latest
    container_name: supportdesk-seq
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:80"      
    volumes:
      - seqdata:/data
  
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: supportdesk-postgres:latest
    container_name: supportdesk-postgres   
    restart: unless-stopped
    command: postgres -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB -c wal_level=replica -c max_wal_senders=10 -c wal_keep_size=1GB -c hot_standby=on
    env_file:
      - ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-replica:
    image: supportdesk-postgres:latest
    container_name: supportdesk-postgres-replica
    restart: unless-stopped
    entrypoint: ["entrypoint-replica.sh"]
    command: postgres -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0 -c hot_standby=on -c hot_standby_feedback=on -c wal_receiver_status_interval=1s -c max_standby_streaming_delay=300s -c max_standby_archive_delay=300s
    env_file:
      - ../.env
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
    ports:
      - "5433:5432"
    volumes:
      - pgdata_replica:/var/lib/postgresql
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      
  rabbitmq:
    image: rabbitmq:3-management
    container_name: supportdesk-rabbitmq  
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

volumes:
  seqdata:
  pgdata:
  pgdata_replica:
  rabbitmqdata: