services:

  postgres:
    image: postgres:18
    command: postgres -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0
    env_file:
      - .env

    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host

    volumes:
      - postgres_data:/var/lib/postgresql
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == primary
      restart_policy:
        condition: any


  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - .env

    ports:
      - target: 5672
        published: 5672
        protocol: tcp
        mode: host

      - target: 15672
        published: 15672
        protocol: tcp
        mode: host

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == primary
      restart_policy:
        condition: any


  seq:
    image: datalust/seq:latest

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"

    ports:
      - target: 80
        published: 5341
        protocol: tcp
        mode: host

    volumes:
      - seq_data:/data

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == primary
      restart_policy:
        condition: on-failure


volumes:
  postgres_data:
  rabbitmq_data:
  seq_data:


networks:
  backend:
    name: SupportDesk_backend
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"