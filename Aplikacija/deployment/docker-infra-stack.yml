services:

  postgres:
    image: ${REGISTRY_IP}:5000/supportdesk-postgres:latest
    command: postgres -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB -c random_page_cost=1.1 -c effective_cache_size=2GB -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0 -c wal_level=replica -c max_wal_senders=10 -c wal_keep_size=1GB -c hot_standby=on
    env_file:
      - .env

    ports:
      - target: 5432
        published: 5432
        protocol: tcp
        mode: host

    volumes:
      - postgres_data:/var/lib/postgresql
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == primary
      restart_policy:
        condition: any


  postgres-replica:
    image: ${REGISTRY_IP}:5000/supportdesk-postgres:latest
    entrypoint: ["entrypoint-replica.sh"]
    command: postgres -c max_connections=1000 -c shared_buffers=512MB -c work_mem=16MB -c random_page_cost=1.1 -c effective_cache_size=2GB -c max_parallel_workers_per_gather=0 -c max_parallel_workers=0 -c hot_standby=on -c hot_standby_feedback=on -c wal_receiver_status_interval=1s -c max_standby_streaming_delay=300s -c max_standby_archive_delay=300s
    env_file:
      - .env

    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      REPLICATION_SLOT: replica_slot

    ports:
      - target: 5432
        published: 5433
        protocol: tcp

    volumes:
      - postgres_replica_data:/var/lib/postgresql/data
      - type: tmpfs
        target: /dev/shm
        tmpfs:
          size: 1073741824

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB || pgrep -f pg_basebackup || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 300s

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == secondary
      restart_policy:
        condition: any


  rabbitmq:
    image: rabbitmq:3-management
    env_file:
      - .env

    ports:
      - target: 5672
        published: 5672
        protocol: tcp
        mode: host

      - target: 15672
        published: 15672
        protocol: tcp
        mode: host

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == primary
      restart_policy:
        condition: any


  seq:
    image: datalust/seq:latest

    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"

    ports:
      - target: 80
        published: 5341
        protocol: tcp
        mode: host

    volumes:
      - seq_data:/data

    networks:
      - backend

    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.role == primary
      restart_policy:
        condition: on-failure


volumes:
  postgres_data:
  postgres_replica_data:
  rabbitmq_data:
  seq_data:


networks:
  backend:
    name: SupportDesk_backend
    driver: overlay
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"