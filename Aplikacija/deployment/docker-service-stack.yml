services:

  webapi:
    image: ${REGISTRY_IP}:5000/supportdesk-webapi:latest

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080

    networks:
      - backend
      - frontend

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    deploy:
      replicas: 2

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: stop-first


  worker:
    image: ${REGISTRY_IP}:5000/supportdesk-worker:latest

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    networks:
      - backend

    deploy:
      replicas: 2

      restart_policy:
        condition: on-failure

      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

      rollback_config:
        parallelism: 1
        order: stop-first


  outbox-processor:
    image: ${REGISTRY_IP}:5000/supportdesk-outbox-processor:latest

    env_file:
      - .env

    environment:
      ASPNETCORE_ENVIRONMENT: Production

    networks:
      - backend

    deploy:
      replicas: 1

      placement:
        constraints:
          - node.labels.role == manager

      restart_policy:
        condition: on-failure


  nginx:
    image: ${REGISTRY_IP}:5000/supportdesk-nginx:latest
    
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
    
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    
    networks:
      - frontend
    
    deploy:
      replicas: 1
      
      placement:
        constraints:
          - node.labels.role == manager
      
      restart_policy:
        condition: on-failure


networks:
  backend:
    external: true
    name: SupportDesk_backend

  frontend:
    name: SupportDesk_frontend
    driver: overlay
    attachable: true